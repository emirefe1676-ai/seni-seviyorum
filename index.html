<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sana küçük bir şeyim var ❤️</title>
<style>
:root{--pink:#ff4f9a;--light:#fff0f7;--deep:#d92d79}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;
font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
background:radial-gradient(circle at top,#fff 0,#fff0f7 48%,#ffd8ea 100%);color:#8d2454}
.card{position:relative;width:min(92vw,470px);padding:42px 25px 36px;text-align:center;
background:rgba(255,255,255,.88);border:1px solid #ffc5df;border-radius:30px;
box-shadow:0 20px 70px #e65c9c2b;z-index:2}
.bigheart{font-size:58px;line-height:1;margin-bottom:18px;animation:beat 1.3s infinite}
h1{font-size:clamp(30px,7vw,42px);margin:0 0 12px;color:var(--deep)}
p{font-size:17px;line-height:1.5;margin:0 0 28px;color:#a64b75}
.buttons{display:flex;gap:13px;justify-content:center;align-items:center;min-height:56px;flex-wrap:wrap}
button{border:0;border-radius:999px;padding:14px 26px;font-weight:750;font-size:16px;cursor:pointer;transition:transform .18s}
#yes{background:linear-gradient(135deg,#ff69aa,#f53688);color:white;box-shadow:0 8px 20px #f5368840}
#no{background:#fff;color:#d9367c;border:1px solid #ffb5d4;position:relative}
#result{display:none;margin-top:24px;font-size:20px;font-weight:700;color:#d92d79;animation:pop .4s ease}
.float{position:fixed;bottom:-40px;color:#ff79b7;opacity:.45;animation:rise linear infinite;z-index:0;pointer-events:none}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="card">
  <div class="bigheart">💗</div>
  <h1>Seni seviyorum ❤️</h1>
  <p>Sana küçük ama kalpten bir sorum var…</p>
  <div class="buttons">
    <button id="yes">Evet 💖</button>
    <button id="no">Hayır 🙈</button>
  </div>
  <div id="result">Ben de bunu duymayı umuyordum! 💞</div>
</div>
<script>
const no=document.getElementById('no');
function moveNo(){
  const pad=14, w=no.offsetWidth, h=no.offsetHeight;
  const x=pad+Math.random()*Math.max(1,window.innerWidth-w-pad*2);
  const y=pad+Math.random()*Math.max(1,window.innerHeight-h-pad*2);
  no.style.position='fixed'; no.style.left=x+'px'; no.style.top=y+'px'; no.style.zIndex=5;
}
no.addEventListener('mouseenter',moveNo);
no.addEventListener('touchstart',e=>{e.preventDefault();moveNo();},{passive:false});
no.addEventListener('click',moveNo);
document.getElementById('yes').addEventListener('click',()=>{
  document.getElementById('result').style.display='block';
  document.querySelector('.bigheart').textContent='💘';
});
for(let i=0;i<16;i++){
  const el=document.createElement('div'); el.className='float'; el.textContent=['♥','♡','💗'][i%3];
  el.style.left=(Math.random()*100)+'vw'; el.style.animationDuration=(7+Math.random()*9)+'s';
  el.style.animationDelay=(-Math.random()*14)+'s'; el.style.fontSize=(16+Math.random()*24)+'px';
  document.body.appendChild(el);
}
</script>
</body>
</html>
